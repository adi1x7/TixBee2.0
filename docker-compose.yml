services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://tixbee:tixbee@db:5432/tixbee_v1
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports: ["3001:3000"]
    depends_on: [api]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tixbee_v1
      POSTGRES_USER: tixbee
      POSTGRES_PASSWORD: tixbee
    volumes: [tixbee_v1_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tixbee -d tixbee_v1"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine

volumes:
  tixbee_v1_postgres:
